<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Theme Admin — Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 32px 28px;
    width: 340px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: #6e6e73; font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: #6e6e73; margin: 12px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid #d2d2d7;
    border-radius: 8px; font-size: 14px;
  }
  button {
    width: 100%; background: #0071e3; color: #fff; border: 0;
    padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 20px;
  }
  button:disabled { background: #a8a8ad; cursor: not-allowed; }
  .msg {
    padding: 10px 12px; border-radius: 6px; margin-top: 12px;
    font-size: 13px; display: none;
  }
  .msg.err { background: #f8d7da; color: #842029; display: block; }
</style>
</head>
<body>
<form class="card" id="f">
  <h1>Theme Admin</h1>
  <p class="sub">Đăng nhập để tiếp tục</p>
  <label>Email hoặc username</label>
  <input type="text" name="email" required autofocus autocomplete="username" />
  <label>Mật khẩu</label>
  <input type="password" name="password" required autocomplete="current-password" />
  <button type="submit" id="btn">Đăng nhập</button>
  <div id="msg" class="msg"></div>
</form>
<script>
const f = document.getElementById('f');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  btn.disabled = true;
  btn.textContent = 'Đang đăng nhập…';
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: f.email.value.trim().toLowerCase(), password: f.password.value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'login failed');
    location.href = '/admin.html';
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Đăng nhập';
  }
});
</script>
</body>
</html>
